# Credenciales de la GitHub App dedicada elpalmeral-arc-runners (ADR 0031), desde 1Password
# (agentic-lab/arc-runners). Claves con el mismo nombre que la variante "GitHub App" de la chart,
# para usarse como secreto "pre-definido" (githubConfigSecret: arc-runners-github-app).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-runners-github-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: arc-runners-github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: arc-runners/app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: arc-runners/installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: arc-runners/private_key
