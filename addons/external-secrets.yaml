# Ola 0 · External Secrets Operator (ADR 0008 del agentic-platform-lab).
# El único secreto manual (token de la service account de 1Password) se crea en el paso 05
# en el namespace external-secrets, ANTES de aplicar la Application raíz.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { memory: 256Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        certController:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
