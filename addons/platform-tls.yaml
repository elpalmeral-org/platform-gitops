# Ola 3 · TLS de la plataforma: credenciales de Route 53 (desde 1Password), emisores de
# Let's Encrypt, certificado comodín y certificado por defecto de Traefik.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-tls
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/elpalmeral-org/platform-gitops.git
    targetRevision: main
    path: config/tls
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
