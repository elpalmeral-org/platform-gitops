# Credenciales de HarnessRouter desde 1Password (agentic-lab/harnessrouter, creado en el paso
# 08.5 del setup del harness). HR_SECRET_KEY cifra lo que HarnessRouter guarda en /data: debe
# sobrevivir a reinicios y upgrades, por eso vive en 1Password y no se regenera aquí.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harnessrouter-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harnessrouter-credentials
    creationPolicy: Owner
  data:
    - secretKey: HR_AUTH_USER
      remoteRef:
        key: harnessrouter/username
    - secretKey: HR_AUTH_PASSWORD
      remoteRef:
        key: harnessrouter/password
    - secretKey: HR_SECRET_KEY
      remoteRef:
        key: harnessrouter/secret_key
