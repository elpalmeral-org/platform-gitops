# Credenciales de HarnessRouter desde 1Password (agentic-lab/harnessrouter, creado en el paso
# 08.5 del setup del harness). HR_SECRET_KEY cifra lo que HarnessRouter guarda en /data: debe
# sobrevivir a reinicios y upgrades, por eso vive en 1Password y no se regenera aquí.
#
# F4.7 (ADR 0033): HR_SECRET_GLOBAL_HARNESS_CONN_OPENROUTER lleva la clave real de OpenRouter
# (capaz de gastar el presupuesto de 10 $) incrustada en el JSON que exige HarnessRouter — por
# eso va por plantilla de ESO, nunca a mano. mergePolicy: Replace (ya es el valor por defecto del
# CRD; se deja explícito) para que openrouterApiKey, usado solo para construir el JSON, no quede
# también como clave suelta en el Secret final.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harnessrouter-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: harnessrouter-credentials
    creationPolicy: Owner
    template:
      mergePolicy: Replace
      data:
        HR_AUTH_USER: "{{ .HR_AUTH_USER }}"
        HR_AUTH_PASSWORD: "{{ .HR_AUTH_PASSWORD }}"
        HR_SECRET_KEY: "{{ .HR_SECRET_KEY }}"
        HR_SECRET_GLOBAL_HARNESS_CONN_OPENROUTER: |
          {"name":"openrouter","provider":"openai","api_key":"{{ .openrouterApiKey }}","base_url":"https://openrouter.ai/api/v1"}
  data:
    - secretKey: HR_AUTH_USER
      remoteRef:
        key: harnessrouter/username
    - secretKey: HR_AUTH_PASSWORD
      remoteRef:
        key: harnessrouter/password
    - secretKey: HR_SECRET_KEY
      remoteRef:
        key: harnessrouter/secret_key
    - secretKey: openrouterApiKey
      remoteRef:
        key: openrouter-api/credential
