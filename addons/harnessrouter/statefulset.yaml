# HarnessRouter CE: Console + Gateway + Runner en un solo contenedor (ADR 0006, ADR 0030).
# StatefulSet de una réplica: /data (BD, credenciales cifradas, workspaces) no se comparte entre
# réplicas. El contenedor EXIGE arrancar como root (baja privilegios por sesión de agente dentro
# de sí mismo); por eso no lleva runAsNonRoot ni runAsUser, a diferencia del resto del repo.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harnessrouter
spec:
  serviceName: harnessrouter
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: harnessrouter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harnessrouter
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: harnessrouter
          image: harnessrouter/harnessrouter@sha256:d6697b27b23a4a4ee30f88edc1668fb49b8c10597617e4c4c3c5ad0a25b9c6e6 # 0.41.13
          ports:
            - name: console
              containerPort: 3000
          env:
            - name: HR_BACKENDS
              value: "opencode,vibe,fast-agent"
            # F4.7 (ADR 0033): Bonsai (llama.cpp en docker01) es compatible con la API de OpenAI;
            # sin autenticación real (LAN interna), así que no es un secreto. La clave real de
            # OpenRouter (HR_SECRET_GLOBAL_HARNESS_CONN_OPENROUTER) va por ExternalSecret.
            - name: HR_SECRET_GLOBAL_HARNESS_CONN_BONSAI
              value: '{"name":"bonsai","provider":"openai","api_key":"not-needed","base_url":"http://192.168.0.6:11435/v1"}'
            # Nombre de esta variable (POLICY_OPENCODE) era una inferencia por el patrón
            # documentado (POLICY_<BACKEND>) hasta que se confirmó de verdad (F4.7, ADR 0033):
            # GET /v1/models mostró los modelos "gpt-*" disponibles para "opencode" y no para
            # "codex" (sin policy), confirmando el nombre y la conexión. Los 5 roles reales
            # (uhp/roles.yaml) van por OpenRouter, sin mezclar Bonsai como fallback silencioso
            # (ADR 0025: ningún rol real va a Bonsai todavía).
            - name: HR_SECRET_GLOBAL_HARNESS_POLICY_OPENCODE
              value: '{"chain":["openrouter"]}'
            # Base dedicada para la prueba de humo con Bonsai (F4.7): no se mezcla con "opencode"
            # para no introducir un fallback silencioso a un modelo local distinto en los roles
            # reales. "fast-agent" no tenía policy propia; queda libre para esto.
            - name: HR_SECRET_GLOBAL_HARNESS_POLICY_FAST_AGENT
              value: '{"chain":["bonsai"]}'
          envFrom:
            - secretRef:
                name: harnessrouter-credentials
          readinessProbe:
            tcpSocket: { port: console }
            periodSeconds: 10
            failureThreshold: 6 # arranque lento: descarga las CLI de las bases la primera vez
          livenessProbe:
            tcpSocket: { port: console }
            initialDelaySeconds: 60
            periodSeconds: 30
          startupProbe:
            tcpSocket: { port: console }
            periodSeconds: 10
            failureThreshold: 18 # hasta 3 min antes de reiniciar el contenedor
          securityContext:
            allowPrivilegeEscalation: false
            # Sin "capabilities: drop: [ALL]": el propio entrypoint hace chown de /data (y crea
            # usuarios del SO por sesión), y eso exige CAP_CHOWN/CAP_DAC_OVERRIDE/CAP_SETUID/
            # CAP_SETGID. "Sin privilegios extra" en la documentación del proyecto significa el
            # conjunto por defecto de Docker (no vacío), no cero capacidades. Probado: con ALL
            # eliminadas, el contenedor entra en CrashLoopBackOff («chown: Operation not permitted»).
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 3Gi }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 15Gi
---
apiVersion: v1
kind: Service
metadata:
  name: harnessrouter
spec:
  selector:
    app.kubernetes.io/name: harnessrouter
  ports:
    - name: console
      port: 3000
      targetPort: console
