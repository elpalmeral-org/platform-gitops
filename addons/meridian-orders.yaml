# Ola 4 · Meridian Orders: una Application por entorno, generada a partir de esta lista.
# Dar de alta un entorno = descomentar su elemento, DESPUÉS de su primera promoción:
# gitops-ok rechaza activar un entorno cuyo overlay aún no tiene imágenes fijadas.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: meridian-orders
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          - env: staging
          # - env: prod      ← tras fusionar el primer PR de promoción a prod
  template:
    metadata:
      name: "meridian-orders-{{ .env }}"
      labels:
        app.kubernetes.io/part-of: meridian-orders
        lab.elpalmeral.es/environment: "{{ .env }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/elpalmeral-org/platform-gitops.git
        targetRevision: main
        path: "apps/meridian-orders/overlays/{{ .env }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "meridian-{{ .env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: meridian-orders
            lab.elpalmeral.es/environment: "{{ .env }}"
        retry:
          limit: 10
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
