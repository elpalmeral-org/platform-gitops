# Entorno dev · se actualiza automáticamente con cada merge en main de meridian-orders.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meridian-dev

resources:
- ../../base

configMapGenerator:
- behavior: replace
  literals:
  - MERIDIAN_ENVIRONMENT=dev
  name: meridian-config

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: orders-dev.apl.elpalmeral.es
  target:
    kind: Ingress
    name: meridian-orders

# Imágenes por digest: NO se editan a mano.
#   scripts/set-meridian-images.sh dev sha-<commit>
images:
- digest: sha256:ecd72482c5cb3fa2c20f4497b46a544c40a70324ce254284a909744e5012d3cc
  name: ghcr.io/elpalmeral-org/meridian-orders-backend
  newName: ghcr.io/elpalmeral-org/meridian-orders-backend
  newTag: sha-3624ab0
- digest: sha256:cf8fe516f043ae25245723b2eed2366c087609e116e46573951d03c710be5896
  name: ghcr.io/elpalmeral-org/meridian-orders-frontend
  newName: ghcr.io/elpalmeral-org/meridian-orders-frontend
  newTag: sha-3624ab0
