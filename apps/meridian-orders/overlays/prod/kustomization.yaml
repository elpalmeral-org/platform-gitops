# Entorno prod · solo recibe versiones que YA están en staging (lo comprueban el script y gitops-ok).
# Se lanza a mano (workflow promote de meridian-orders, entorno con aprobación) y lo fusiona una persona.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meridian-prod

resources:
- ../../base

configMapGenerator:
- behavior: replace
  literals:
  - MERIDIAN_ENVIRONMENT=prod
  name: meridian-config

# prod: dos réplicas de API (sin estado) para que un despliegue no corte el servicio
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: orders.apl.elpalmeral.es
  target:
    kind: Ingress
    name: meridian-orders
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: backend

# Imágenes por digest: NO se editan a mano.
#   workflow "promote" de meridian-orders → scripts/promote-meridian.sh prod X.Y.Z
images:
- digest: sha256:c2628d933481ccc0ede5931a3c53055161c4d4e4e3555d37e0794f1f4c505aa3
  name: ghcr.io/elpalmeral-org/meridian-orders-backend
  newName: ghcr.io/elpalmeral-org/meridian-orders-backend
  newTag: 0.1.0
- digest: sha256:0a73b32ecead63c9ba16c3d9bdeb0950d7730bc2bae4374141b5263915f68f62
  name: ghcr.io/elpalmeral-org/meridian-orders-frontend
  newName: ghcr.io/elpalmeral-org/meridian-orders-frontend
  newTag: 0.1.0
