# Migraciones de Alembic en cada sincronización, ANTES de actualizar el backend.
# Hook "Sync" en la ola 1: corre después de crear la base de datos (ola 0) y antes de los
# Deployments (ola 2). Si falla, Argo CD no despliega la nueva versión del backend.
apiVersion: batch/v1
kind: Job
metadata:
  name: orders-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 10 # la primera vez la base de datos puede tardar en estar lista
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: ghcr.io/elpalmeral-org/meridian-orders-backend
          command: ["alembic", "upgrade", "head"]
          env:
            - name: MERIDIAN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
