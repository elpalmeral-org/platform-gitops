# Base de datos de Meridian Orders (CloudNativePG). Una instancia por entorno: sin HA (lab).
# El operador crea el Secret "orders-db-app" con usuario, contraseña y la clave "uri".
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: orders-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  bootstrap:
    initdb:
      database: app
      owner: app
  storage:
    storageClass: local-path
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
