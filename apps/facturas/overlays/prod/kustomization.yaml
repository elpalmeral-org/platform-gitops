# Entorno prod · solo recibe versiones que YA están en staging (lo comprueban el script y gitops-ok).
# Se lanza a mano (workflow promote de facturas, entorno con aprobación) y lo fusiona una persona.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: facturas-prod

resources:
- ../../base

configMapGenerator:
- behavior: replace
  literals:
  - FACTURAS_ENVIRONMENT=prod
  - OTEL_SERVICE_NAME=facturas
  - OTEL_EXPORTER_OTLP_ENDPOINT=http://192.168.0.6:4317
  - OTEL_RESOURCE_ATTRIBUTES=environment=prod
  name: facturas-config

# prod: dos réplicas de API (sin estado) para que un despliegue no corte el servicio
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: facturas.apl.elpalmeral.es
  target:
    kind: Ingress
    name: facturas
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: backend

