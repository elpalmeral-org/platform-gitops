# Secret de las notificaciones de Argo CD (F3.4c): la URL del webhook argocd-deployments de Port.
# La URL lleva la clave del webhook: vive en 1Password (agentic-lab/Port webhook argocd), nunca en Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
  data:
    - secretKey: port-webhook-url
      remoteRef:
        key: Port webhook argocd/credential
