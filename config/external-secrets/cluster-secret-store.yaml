# Almacén de secretos de todo el clúster: la bóveda agentic-lab de 1Password,
# leída con la service account k3s01-external-secrets (solo lectura).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: agentic-lab
      auth:
        serviceAccountSecretRef:
          name: onepassword-sa-token # creado a mano en el paso 05 (el único)
          key: token
          namespace: external-secrets
