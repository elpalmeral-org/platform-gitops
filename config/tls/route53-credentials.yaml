# Claves del usuario IAM cert-manager-k3s01 (solo TXT _acme-challenge.apl): vienen de
# 1Password (bóveda agentic-lab). Los ClusterIssuer leen sus secretos del namespace cert-manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: route53-credentials
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: route53-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: AWS Route53 cert-manager/access_key_id
    - secretKey: secret-access-key
      remoteRef:
        key: AWS Route53 cert-manager/secret_access_key
