# Certificado comodín del lab. Vive en kube-system (namespace de Traefik en k3s) para que
# Traefik lo use como certificado por defecto: ningún servicio necesita su propio Certificate.
# Emitido por Let's Encrypt producción (PR 2, tras validar la cadena con staging en el PR 1).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-apl
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: wildcard-apl-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: "*.apl.elpalmeral.es"
  dnsNames:
    - "*.apl.elpalmeral.es"
    - "apl.elpalmeral.es"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
