# Valores de Argo CD (chart argo/argo-cd).
# Los usan DOS sitios y deben ser el mismo fichero:
#   1. El bootstrap manual (paso 05):  helm upgrade --install argocd argo/argo-cd -f bootstrap/argocd-values.yaml
#   2. La Application addons/argocd.yaml, con la que Argo CD se gestiona a sí mismo después.

configs:
  params:
    # TLS lo terminará Traefik con el certificado comodín (ola 3); dentro del clúster va en HTTP
    server.insecure: true
  cm:
    timeout.reconciliation: 180s
    # Las Application hijas exponen su salud: así las sync-waves del app-of-apps
    # esperan a que cada oleada esté sana antes de lanzar la siguiente.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

# Fuera lo que no usamos todavía (ahorra ~300 MiB)
dex:
  enabled: false
notifications:
  enabled: false

# Recursos ajustados a un nodo de 10 GiB
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
server:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
applicationSet:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
redis:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
