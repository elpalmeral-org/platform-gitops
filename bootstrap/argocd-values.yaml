# Valores de Argo CD (chart argo/argo-cd).
# Los usan DOS sitios y deben ser el mismo fichero:
#   1. El bootstrap manual (paso 05):  helm upgrade --install argocd argo/argo-cd -f bootstrap/argocd-values.yaml
#   2. La Application addons/argocd.yaml, con la que Argo CD se gestiona a sí mismo después.

# Nombre público de la UI (también fija la URL que Argo CD usa en enlaces y en el SSO futuro)
global:
  domain: argocd.apl.elpalmeral.es

configs:
  params:
    # TLS lo terminará Traefik con el certificado comodín (ola 3); dentro del clúster va en HTTP
    server.insecure: true
  cm:
    timeout.reconciliation: 180s
    # Las Application hijas exponen su salud: así las sync-waves del app-of-apps
    # esperan a que cada oleada esté sana antes de lanzar la siguiente.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

# Fuera lo que no usamos todavía (ahorra ~300 MiB)
dex:
  enabled: false

# Notificaciones (F3.4c · ADR 0020): Argo CD confirma en Port cada despliegue de Meridian Orders.
# Webhook SALIENTE a Port; su URL (lleva la clave) llega por ESO desde 1Password:
# config/base/argocd/notifications-secret.yaml → Secret argocd-notifications-secret.
notifications:
  enabled: true
  argocdUrl: https://argocd.apl.elpalmeral.es
  secret:
    create: false # lo crea ESO
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  notifiers:
    service.webhook.port: |
      url: $port-webhook-url
      headers:
        - name: Content-Type
          value: application/json
  templates:
    # Cuerpo que entiende el webhook argocd-deployments (agentic-platform-lab/port/webhook-argocd.tf)
    template.port-deployment: |
      webhook:
        port:
          method: POST
          body: |
            {"app": "{{.app.metadata.name}}", "sync": "{{.app.status.sync.status}}", "health": "{{.app.status.health.status}}", "phase": "{{if .app.status.operationState}}{{.app.status.operationState.phase}}{{end}}", "revision": "{{.app.status.sync.revision}}", "finishedAt": "{{if .app.status.operationState}}{{.app.status.operationState.finishedAt}}{{end}}", "images": [{{range $i, $img := .app.status.summary.images}}{{if $i}}, {{end}}"{{$img}}"{{end}}]}
  triggers:
    # Los tres del catálogo oficial de Argo CD, enviados a Port
    trigger.on-deployed: |
      - description: Sincronizado y sano (una vez por revisión)
        oncePer: app.status.operationState?.syncResult?.revision
        send: [port-deployment]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
    trigger.on-health-degraded: |
      - description: La aplicación se ha degradado
        send: [port-deployment]
        when: app.status.health.status == 'Degraded'
    trigger.on-sync-failed: |
      - description: La sincronización ha fallado
        send: [port-deployment]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']

# Recursos ajustados a un nodo de 10 GiB
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
server:
  # HTTPS lo sirve Traefik con el comodín *.apl (TLSStore default): sin Certificate ni Secret propios
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    tls: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
applicationSet:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
redis:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
